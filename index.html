<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Checklist — Listas de Tarefas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1F23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="root"></div>
<div id="printSheet" class="print-only"></div>

<!--
  React e ReactDOM vêm de um CDN público (unpkg) — carregados pelo
  navegador de quem abrir a página, não fazem parte dos arquivos deste
  projeto. Não precisa instalar nada nem rodar build: o navegador já
  entende módulos ES (import/export) nativamente.
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // Altere '/sw.js' para './sw.js' ou 'sw.js'
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker registrado com sucesso!'))
      .catch((err) => console.error('Erro ao registrar Service Worker:', err));
  }
</script>

</body>
</html>
